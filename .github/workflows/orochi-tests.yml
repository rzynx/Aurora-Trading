name: Orochi paper-bot tests

on:
  push:
    branches:
      - main
      - "orochi/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r paperbot_work/requirements.txt pytest
      - name: Run risk-sizing tests
        env:
          PYTHONPATH: paperbot_work
        run: pytest -q tests
